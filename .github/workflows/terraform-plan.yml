name: terraform plan

on:
  pull_request:
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_app_ami_id: ${{ vars.APP_AMI_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Mask AWS account ID
        working-directory: .
        run: echo "::add-mask::$TF_VAR_aws_account_id"

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - run: terraform plan -lock=false -input=false